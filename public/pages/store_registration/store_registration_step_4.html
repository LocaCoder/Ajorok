<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحله چهارم: بارگذاری مدارک | جوروک</title>
    <meta name="description"
        content="مدارک مورد نیاز برای بررسی فروشگاه را بارگذاری کنید. فرمت‌های مجاز: PDF، JPG، PNG">
    <link rel="stylesheet" href="../../styles/output.css">
</head>

<body class="font-IRANSansXRegular bg-[#F2F2F2] text-custom-black">
    <svg class="hidden">
        <symbol id="tick" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 13L8.52642 15.8211C9.35374 16.483 10.5536 16.3848 11.2624 15.5973L19 7" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
    </svg>

    <!-- Header -->
    <header class="h-[72px] border-b border-[#ececec] bg-white" role="banner">
        <div class="mx-auto flex h-full max-w-[1536px] items-center justify-between px-4 sm:px-6 lg:px-[60px]">
            <div class="flex items-center gap-4">
                <img src="../../images/logo/Logo.svg" alt="لوگو فروشگاه جوروک" width="55" height="61" />
                <span class="hidden h-10 w-px bg-[#d9d9d9] sm:block" aria-hidden="true"></span>
                <nav class="hidden items-center gap-8 md:flex" aria-label="منوی اصلی">
                    <a href="#" class="flex items-center gap-2 text-[15px] font-medium text-[#2b2b2b]">
                        <img src="../../images/Header/home 04.svg" alt="آیکون خانه" width="20" height="20" />
                        صفحه اصلی
                    </a>
                    <button class="flex items-center gap-2 text-[15px] font-medium text-[#2b2b2b]"
                        aria-expanded="false">
                        <img src="../../images/Header/grid 02.svg" alt="آیکون صفحات" width="20" height="20" />
                        صفحات پنل
                        <img src="../../images/Header/direction-down 01.svg" alt="باز کردن منو" width="20"
                            height="20" />
                    </button>
                </nav>
            </div>
            <div class="flex items-center gap-3 sm:gap-7" dir="ltr">
                <div class="flex items-center gap-3">
                    <div class="h-9 w-9 rounded-full bg-[#202020]" role="img" aria-label="آواتار ادمین"></div>
                    <div class="hidden leading-tight sm:block">
                        <div class="text-[14px] font-medium text-[#222]">ادمین</div>
                        <div class="mt-1 text-[11px] font-light text-[#777]">سطح ادمین</div>
                    </div>
                </div>
                <div class="hidden items-center gap-3 sm:flex lg:gap-5">
                    <button class="grid h-9 w-9 place-items-center rounded-lg hover:bg-[#f7f7f7]" aria-label="اعلان‌ها">
                        <img src="../../images/Header/notification.svg" alt="آیکون اعلان" width="20" height="20" />
                    </button>
                    <button class="grid h-9 w-9 place-items-center rounded-lg hover:bg-[#f7f7f7]" aria-label="پیام‌ها">
                        <img src="../../images/Header/mail.svg" alt="آیکون پیام" width="20" height="20" />
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Steps Progress Bar -->
        <section class="steps font-IRANSansXRegular w-full md:w-[740px] flex items-center justify-center mx-auto mt-20"
            aria-label="مراحل ثبت فروشگاه">
            <div class="relative w-full text-sm md:text-base">
                <div class="absolute left-0 right-0 top-5 transform h-[3px] bg-[#E0E0E0] w-11/12 mx-auto"></div>
                <div class="absolute top-5 right-0 h-[3px] bg-[#7b2e1f] -translate-y-1/2 w-11/12 mr-6"
                    style="width: 90%;"></div>

                <div class="relative z-10 flex justify-between items-center">
                    <a href="store_registration_step_1.html"
                        class="font-IRANSansXMedium flex flex-col items-center text-center">
                        <div
                            class="size-9 rounded-full bg-custom-brown text-white flex items-center justify-center z-20">
                            <svg class="size-5 text-white" aria-hidden="true">
                                <use href="#tick"></use>
                            </svg>
                        </div>
                        <span class="mt-2">انتخاب دسته</span>
                    </a>
                    <a href="store_registration_step_2.html" class="flex flex-col items-center text-center">
                        <div class="size-9 rounded-full bg-custom-brown text-white flex items-center justify-center">
                            <svg class="size-5 text-white" aria-hidden="true">
                                <use href="#tick"></use>
                            </svg>
                        </div>
                        <span class="mt-2">اطلاعات اولیه</span>
                    </a>
                    <a href="store_registration_step_3.html" class="flex flex-col items-center text-center">
                        <div class="size-9 rounded-full bg-custom-brown text-white flex items-center justify-center">
                            <svg class="size-5 text-white" aria-hidden="true">
                                <use href="#tick"></use>
                            </svg>
                        </div>
                        <span class="mt-2">اطلاعات تکمیلی</span>
                    </a>
                    <div class="flex flex-col items-center text-center" aria-current="step">
                        <div
                            class="size-9 rounded-full bg-custom-brown border-[3px] border-custom-brown flex items-center justify-center">
                            <span class="text-sm text-white">۴</span>
                        </div>
                        <span class="mt-2">بارگذاری مدارک</span>
                    </div>
                    <div class="flex flex-col items-center text-center">
                        <div
                            class="size-9 rounded-full bg-[#E0E0E0] border-[3px] border-custom-brown flex items-center justify-center">
                            <span class="text-sm text-black">۵</span>
                        </div>
                        <span class="mt-2">ثبت نهایی</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- کارت بارگذاری مدارک -->
        <section class="bg-white rounded-2xl p-7 md:p-9 mt-16">
            <h1 class="text-[15px] font-IRANSansXDemiBold text-custom-black mb-4">مدارک مورد نیاز برای بررسی فروشگاه را
                بارگذاری کنید.</h1>
            <p class="text-[13px] text-custom-black/60 font-IRANSansXRegular mb-7">فرمت‌های مجاز: PDF، JPG، PNG. حداکثر
                حجم هر فایل: ۱۰ مگابایت</p>

            <div id="docList" class="flex flex-col gap-4 mb-8" role="list">
                <!-- ردیف‌های مدرک با JS ساخته می‌شوند -->
            </div>

            <div class="!col-span-2 w-full mt-20 flex flex-wrap justify-between gap-4">
                <a href="store_registration_step_4.html" id="prevStepLink"
                    class="hidden md:flex items-center gap-1.5 text-[13px] font-IRANSansXMedium text-custom-black hover:text-custom-brown">
                    <img src="../../images/AdminDashboard/Seller/arrow-right.svg" alt="مرحله قبل" width="20" height="20" />
                    <span>مرحله قبل</span>
                </a>
                <div class="w-full md:w-[500px] flex items-center gap-3 md:gap-6">
                    <button id="cancelBtn" class="w-1/3 md:w-1/2  py-2 rounded-md border border-[#999999] text-gray-700 " type="button">
                        <span class="hidden md:block">انصراف</span>
                        <span class="block md:hidden">بازگشت</span>
                    </button>
                    <button id="confirmBtn"
                        class="w-2/3 md:w-1/2  py-2 rounded-md text-white transition-all duration-300 bg-custom-brown ">
                        تایید
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script src="../../scripts/store_registration/validator.js"></script>
    <script src="../../scripts/store_registration/documentUpload.js"></script>
</body>

</html>
