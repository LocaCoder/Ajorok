<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود به پنل فروشندگان</title>
  <!-- <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" /> -->

  <link rel="stylesheet" href="../../../../styles/output.css">

  <style>
    /* فقط چیزهایی که Tailwind به‌صورت مستقیم پوشش نمی‌دهد */
    input::placeholder {
      direction: rtl;
    }

    #mobile {
      direction: ltr;
    }
  </style>
</head>

<body class="font-IRANSansXRegular bg-panel text-[#1c1b1a] min-h-screen flex items-center justify-center p-4 md:p-8">

  <div
    class="w-full max-w-[920px] min-h-[420px] bg-white rounded-2xl overflow-hidden shadow-sm flex flex-col md:flex-row">

    <!-- ستون فرم -->
    <div class="flex-none md:basis-[42%] w-full flex flex-col p-8 md:p-11">
      <h1 class="text-xl font-bold mb-2.5">ورود به پنل فروشندگان</h1>
      <p class="text-[13.5px] leading-[1.9] text-[#6f6b68] mb-7">
        با شماره همراه خود وارد شوید یا فروشگاه خود را بسازید.
      </p>

      <label for="mobile" class="block text-[13px] font-medium text-[#4a4744] mb-2">شماره همراه</label>

      <div class="relative mb-2" id="fieldWrap">
        <input id="mobile" type="tel" inputmode="numeric" placeholder="مثال: ۰۹۱۲۱۲۳۴۵۶۷" autocomplete="tel"
          class="w-full h-12 rounded-[10px] border-2 border-idle pr-4 pl-11 text-[15px] text-right outline-none transition-colors focus:border-custom-brown" />
        <button type="button" id="clearBtn" aria-label="پاک کردن"
          class="hidden absolute top-1/2 left-3.5 -translate-y-1/2 w-5 h-5 items-center justify-center text-brick-dark text-[15px] leading-none bg-transparent border-none cursor-pointer">✕</button>
      </div>

      <div id="fieldMsg" class="min-h-[18px] text-[12.5px] text-red-600 mb-5"></div>

      <button type="button" id="submitBtn" disabled
        class="w-full h-12 rounded-[10px] text-[15px] font-semibold transition-colors bg-[#f6e3de] text-white cursor-not-allowed mt-1">ارسال
        کد تایید</button>

      <div class="mt-5 text-center text-[12.5px] text-custom-brown">
        <a href="#" class="hover:underline">راهنمای ثبت نام</a>
        <span class="text-[#d8d4d0] mx-2.5">|</span>
        <a href="#" class="hover:underline">تماس با پشتیبانی</a>
      </div>
    </div>

    <!-- ستون تصویر -->
    <div class="flex-1 relative bg-[#121212] min-h-[200px] overflow-hidden">
      <svg viewBox="0 0 700 600" preserveAspectRatio="xMidYMid slice" class="absolute inset-0 w-full h-full">
        <rect width="700" height="600" fill="#121212" />
        <g stroke="#c9633f" stroke-width="0.6" opacity="0.35">
          <line x1="0" y1="120" x2="700" y2="120" />
          <line x1="0" y1="480" x2="700" y2="480" />
          <line x1="220" y1="0" x2="220" y2="600" />
          <line x1="520" y1="0" x2="520" y2="600" />
          <line x1="0" y1="0" x2="220" y2="120" />
          <line x1="520" y1="0" x2="700" y2="120" />
        </g>
        <rect x="60" y="60" width="120" height="420" fill="#2b2b2b" />
        <rect x="60" y="60" width="120" height="8" fill="#3a3a3a" />
        <rect x="60" y="220" width="120" height="8" fill="#3a3a3a" />
        <rect x="60" y="380" width="120" height="8" fill="#3a3a3a" />
        <rect x="230" y="90" width="180" height="260" fill="#4a4a4a" />
        <rect x="440" y="180" width="170" height="300" fill="#a2502f" />
        <g fill="#8c3f22">
          <rect x="440" y="180" width="18" height="300" />
          <rect x="470" y="180" width="18" height="300" />
          <rect x="500" y="180" width="18" height="300" />
          <rect x="530" y="180" width="18" height="300" />
          <rect x="560" y="180" width="18" height="300" />
          <rect x="590" y="180" width="18" height="300" />
        </g>
        <g fill="#c9633f" opacity="0.6">
          <circle cx="640" cy="90" r="2.5" />
          <circle cx="655" cy="90" r="2.5" />
          <circle cx="670" cy="90" r="2.5" />
          <circle cx="640" cy="105" r="2.5" />
          <circle cx="655" cy="105" r="2.5" />
          <circle cx="670" cy="105" r="2.5" />
        </g>
      </svg>
    </div>

  </div>

  <script src="../../../../scripts/store_registration/validator.js"></script>
  <script>
    (function () {
      const input = document.getElementById('mobile');
      const wrap = document.getElementById('fieldWrap');
      const msg = document.getElementById('fieldMsg');
      const clearBtn = document.getElementById('clearBtn');
      const submitBtn = document.getElementById('submitBtn');

      const BORDER_IDLE = 'border-[#9C4639]';
      const BORDER_SUCCESS = 'border-[#16A34A]';
      const BORDER_ERROR = 'border-[#D22121]';

      function setState(state) {
        // state: 'idle' | 'success' | 'error'
        input.classList.remove(BORDER_IDLE, BORDER_SUCCESS, BORDER_ERROR);
        if (state === 'success') input.classList.add(BORDER_SUCCESS);
        else if (state === 'error') input.classList.add(BORDER_ERROR);
        else input.classList.add(BORDER_IDLE);
      }

      function refreshClear() {
        const hasValue = input.value.trim().length > 0;
        clearBtn.classList.toggle('hidden', !hasValue);
        clearBtn.classList.toggle('flex', hasValue);
      }

      function evaluate({ showErrors }) {
        const result = Validator.validateMobile(input.value);

        if (result.valid) {
          setState('success');
          msg.textContent = '';
          submitBtn.disabled = false;
          submitBtn.classList.remove('bg-[#F5EDEB]', 'text-[#CCCCCC]', 'cursor-not-allowed');
          submitBtn.classList.add('bg-custom-brown', 'text-white', 'cursor-pointer');
        } else {
          submitBtn.disabled = true;
          submitBtn.classList.add('bg-[#F5EDEB]', 'text-[#CCCCCC]', 'cursor-not-allowed');
          submitBtn.classList.remove('bg-custom-brown', 'text-white', 'cursor-pointer');

          if (showErrors) {
            setState('error');
            msg.textContent = result.message;
          } else {
            setState('idle');
            msg.textContent = '';
          }
        }
        return result;
      }

      input.addEventListener('input', () => {
        const digits = Validator.digitsOnly(input.value).slice(0, 11);
        input.value = digits;
        refreshClear();
        evaluate({ showErrors: false });
      });

      input.addEventListener('blur', () => {
        evaluate({ showErrors: true });
      });

      clearBtn.addEventListener('click', () => {
        input.value = '';
        refreshClear();
        evaluate({ showErrors: false });
        input.focus();
      });

      submitBtn.addEventListener('click', () => {
        const result = evaluate({ showErrors: true });
        if (!result.valid) return;

        submitBtn.textContent = 'در حال ارسال...';
        submitBtn.disabled = true;
        setTimeout(() => {
          window.location.href = `verify.html?mobile=${result.value}`;
        }, 600);
      });
    })();
  </script>
</body>

</html>
