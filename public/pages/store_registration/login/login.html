<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به پنل فروشندگان | جوروک</title>
  <meta name="description" content="با شماره همراه خود وارد شوید یا فروشگاه خود را بسازید.">
  <link rel="stylesheet" href="../../../styles/output.css">
</head>

<body class="bg-[#FCFCFC] md:bg-custom-bg text-custom-black min-h-screen font-IRANSansXRegular">
  <!-- Header -->
  <header class="h-[72px] border-b border-[#ececec] bg-white" role="banner">
    <div class="mx-auto flex h-full max-w-[1536px] items-center justify-between px-4 sm:px-6 lg:px-[60px]">
      <div class="flex items-center gap-4">
        <img src="../../../images/logo/Logo.svg" alt="لوگو فروشگاه جوروک" width="55" height="61" />
        <span class="hidden h-10 w-px bg-[#d9d9d9] sm:block" aria-hidden="true"></span>
        <nav class="hidden items-center gap-8 md:flex" aria-label="منوی اصلی">
          <a href="#" class="flex items-center gap-2 text-[15px] font-medium text-[#2b2b2b]">
            <img src="../../../images/Header/home 04.svg" alt="آیکون خانه" width="20" height="20" />
            صفحه اصلی
          </a>
          <button class="flex items-center gap-2 text-[15px] font-medium text-[#2b2b2b]" aria-expanded="false">
            <img src="../../../images/Header/grid 02.svg" alt="آیکون صفحات" width="20" height="20" />
            صفحات پنل
            <img src="../../../images/Header/direction-down 01.svg" alt="باز کردن منو" width="20" height="20" />
          </button>
        </nav>
      </div>
      <div class="flex items-center gap-3 sm:gap-7" dir="ltr">
        <div class="flex items-center gap-3">
          <div class="h-9 w-9 rounded-full bg-[#202020]" role="img" aria-label="آواتار ادمین"></div>
          <div class="hidden leading-tight sm:block">
            <div class="text-[14px] font-medium text-[#222]">ادمین</div>
            <div class="mt-1 text-[11px] font-light text-[#777]">سطح ادمین</div>
          </div>
        </div>
        <div class="hidden items-center gap-3 sm:flex lg:gap-5">
          <button class="grid h-9 w-9 place-items-center rounded-lg hover:bg-[#f7f7f7]" aria-label="اعلان‌ها">
            <img src="../../../images/Header/notification.svg" alt="آیکون اعلان" width="20" height="20" />
          </button>
          <button class="grid h-9 w-9 place-items-center rounded-lg hover:bg-[#f7f7f7]" aria-label="پیام‌ها">
            <img src="../../../images/Header/mail.svg" alt="آیکون پیام" width="20" height="20" />
          </button>
        </div>
      </div>
    </div>
  </header>

  <div
    class="max-w-[1000px] mx-auto min-h-[410px] md:h-[500px] md:bg-white rounded-xl overflow-hidden shadow-sm flex flex-col md:flex-row mt-12">
    <div class="w-1/2 flex-1 relative bg-custom-black min-h-[200px] h-auto overflow-hidden hidden md:block">
      <img src="../../../images/store_registeration/ajorok-seller-login-visual-raw 1.jpg"
        alt="تصویر ورود به پنل فروشندگان جوروک" class="w-full h-full object-cover">
    </div>
    <div class="w-full md:w-1/2 flex-none flex flex-col p-8 md:p-14">
      <h1 class="text-xl font-IRANSansXBold text-custom-black mb-2.5">ورود به پنل فروشندگان</h1>
      <p class="text-[13.5px] leading-[1.9] text-custom-black/60 font-IRANSansXRegular mb-12">با شماره همراه خود وارد
        شوید یا فروشگاه خود را بسازید.</p>

      <label for="mobile" class="block text-[13px] font-IRANSansXMedium text-custom-black/80 mb-2">شماره همراه</label>

      <div class="relative mb-2" id="fieldWrap">
        <input id="mobile" type="tel" inputmode="numeric" placeholder="مثال: ۰۹۱۲۱۲۳۴۵۶۷" autocomplete="tel"
          class="w-full h-12 rounded-[10px] border-[1.5px] border-custom-gray pr-4 pl-11 text-[15px] text-right outline-none transition-colors focus:border-custom-brown font-IRANSansXRegular"
          aria-describedby="mobile-error" />
        <button type="button" id="clearBtn" aria-label="پاک کردن"
          class="hidden absolute top-1/2 left-3.5 -translate-y-1/2 w-5 h-5 items-center justify-center text-custom-brown text-[15px] leading-none bg-transparent border-none cursor-pointer">✕</button>
      </div>

      <div id="mobile-error" class="min-h-[18px] text-[12.5px] text-red-600 font-IRANSansXRegular mb-8" role="alert">
      </div>

      <button type="button" id="submitBtn" disabled
        class="w-full h-12 rounded-[10px] text-[15px] font-IRANSansXDemiBold transition-colors bg-custom-brown/10 text-custom-brown/40 cursor-not-allowed mt-1">ارسال
        کد تایید</button>

      <div class="mt-10 text-center text-[12.5px] text-custom-brown font-IRANSansXRegular">
        <a href="#" class="hover:underline">راهنمای ثبت نام</a>
        <span class="text-custom-gray mx-2.5">|</span>
        <a href="#" class="hover:underline">تماس با پشتیبانی</a>
      </div>
    </div>
  </div>

  <script src="../../../scripts/store_registration/validator.js"></script>
  <script src="../../../scripts/store_registration/login.js"></script>
</body>

</html>
