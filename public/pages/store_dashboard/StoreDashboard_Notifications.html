  <!-- =========================================================
       MAIN

  <main class="store-shell mx-auto w-full max-w-[1200px] px-4 pb-32 pt-5 md:pb-16 md:pt-[54px] lg:px-0" role="main">

    <section class="store-page-title-card mb-6 hidden md:flex">
      <h1 class="store-title">اعلان‌ها</h1>
    </section>

    <!-- کارت اصلی -->
    <section class="rounded-[14px] bg-white shadow-card">

      <!-- تب‌ها + دکمه خواندن همه -->
      <div class="flex items-center justify-between border-b border-[#d8d8d8] px-4 md:px-6">
        <div id="notificationTabs" class="flex items-center gap-2 overflow-x-auto no-scrollbar">
          <button type="button" data-notif-tab="all"
            class="notif-tab h-[58px] shrink-0 border-b-[3px] border-[#aa4938] px-4 text-[14px] font-medium text-[#aa4938]">
            همه
          </button>
          <button type="button" data-notif-tab="unread"
            class="notif-tab h-[58px] shrink-0 border-b-[3px] border-transparent px-4 text-[14px] text-[#333]">
            خوانده نشده
          </button>
        </div>

        <button type="button" id="markAllReadBtn"
          class="hidden text-[12px] font-medium text-[#aa4938] hover:underline md:block">
          خواندن همه
        </button>
      </div>

      <!-- نوار فیلتر چیپ -->
      <div class="flex flex-col gap-3 border-b border-[#ededed] px-4 py-4 md:flex-row md:items-center md:justify-between md:px-6">
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar">
          <button type="button" data-notif-type="all"
            class="notif-chip shrink-0 rounded-full border border-[#aa4938] bg-[#fff6f3] px-4 py-2 text-[12px] font-medium text-[#aa4938]">
            همه
          </button>
          <button type="button" data-notif-type="success"
            class="notif-chip shrink-0 rounded-full border border-[#d0d0d0] bg-white px-4 py-2 text-[12px] text-[#444]">
            موفق
          </button>
          <button type="button" data-notif-type="warning"
            class="notif-chip shrink-0 rounded-full border border-[#d0d0d0] bg-white px-4 py-2 text-[12px] text-[#444]">
            هشدار
          </button>
          <button type="button" data-notif-type="error"
            class="notif-chip shrink-0 rounded-full border border-[#d0d0d0] bg-white px-4 py-2 text-[12px] text-[#444]">
            خطا
          </button>
          <button type="button" data-notif-type="info"
            class="notif-chip shrink-0 rounded-full border border-[#d0d0d0] bg-white px-4 py-2 text-[12px] text-[#444]">
            اطلاع‌رسانی
          </button>
        </div>

        <button type="button" id="mobileMarkAllReadBtn"
          class="text-right text-[12px] font-medium text-[#aa4938] hover:underline md:hidden">
          خواندن همه
        </button>
      </div>

      <!-- لیست اعلان‌ها -->
      <div id="notificationList" class="space-y-3 p-4 md:p-6"></div>

      <!-- حالت خالی -->
      <div id="notificationEmpty" class="store-empty hidden">
        <img src="../../images/StoreDashboard/Reviews/empty-reviews.svg" alt="بدون اعلان" />
        <h2 class="text-[15px] font-medium text-[#333]">اعلانی برای نمایش وجود ندارد</h2>
        <p class="store-empty-hint">اعلان‌های جدید شما در این بخش نمایش داده می‌شوند.</p>
      </div>
    </section>
