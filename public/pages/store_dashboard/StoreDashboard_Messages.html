  <!-- =========================================================
       MAIN
  ========================================================== -->
  <main class="store-shell mx-auto w-full max-w-[1200px] px-4 pb-32 pt-5 md:pb-16 md:pt-[54px] lg:px-0" role="main">
    <section class="store-page-title-card mb-6 hidden md:flex items-center gap-3">

      <a href="StoreDashboard.html">
        <svg class="size-8">
          <use href="#icon-arrow-right"></use>
        </svg>
      </a>
      <h1 class="font-IRANSansXMedium text-lg text-custom-brown px-4 border-b-[3px] border-custom-brown pb-2">
        گفت‌وگوها
      </h1>
    </section>

    <!-- =========================================================
         DESKTOP LAYOUT
    ========================================================== -->
    <section class="hidden grid-cols-[minmax(0,1fr)_380px] gap-5 md:grid">

      <!-- CHAT PANEL (چپ) -->
      <section class="desktop-chat-height flex min-w-0 flex-col overflow-hidden rounded-[12px] bg-white shadow-card"
        aria-label="گفت‌وگوی انتخاب‌شده">

        <!-- هدر چت -->
        <div class="relative flex h-[64px] shrink-0 items-center border-b border-[#d6d6d6] px-4">
          <button type="button" id="desktopMoreBtn"
            class="grid h-10 w-10 place-items-center rounded-md hover:bg-[#f5f5f5]" aria-label="گزینه‌های گفت‌وگو"
            aria-expanded="false">
            <svg class="h-5 w-5" aria-hidden="true">
              <use href="#icon-more"></use>
            </svg>
          </button>

          <div id="desktopMoreMenu"
            class="floating-menu absolute left-4 top-[56px] z-30 hidden w-[190px] overflow-hidden rounded-[8px] border border-[#dedede] bg-white">
            <button type="button" data-open-report>گزارش گفتگو</button>
          </div>

          <div class="mr-auto flex items-center gap-3">
            <span id="desktopChatName" class="text-[15px] font-medium">نام کاربر</span>
            <div class="grid h-[42px] w-[42px] place-items-center rounded-full bg-[#e6e6e6] text-[#263247]">
              <svg class="h-6 w-6" aria-hidden="true">
                <use href="#icon-user"></use>
              </svg>
            </div>
          </div>
        </div>

        <!-- پیام‌ها -->
        <div id="desktopChatMessages" class="chat-scroll flex-1 overflow-y-auto bg-[#fdfdfd] px-4 py-4 space-y-4">
        </div>

        <!-- فرم ارسال -->
        <form id="desktopMessageForm"
          class="flex h-[88px] shrink-0 items-center gap-3 border-t border-[#cfcfcf] bg-white px-4" dir="ltr">
          <button type="submit"
            class="h-[44px] w-[70px] shrink-0 rounded-[7px] bg-[#aa4938] text-[14px] font-medium text-white hover:bg-[#934033]">
            ارسال
          </button>
          <label class="flex h-[44px] min-w-0 flex-1 items-center rounded-[7px] border border-[#8f8f8f] bg-white px-4"
            dir="rtl">
            <input id="desktopMessageInput" type="text"
              class="h-full min-w-0 flex-1 bg-transparent text-right text-[14px] outline-none placeholder:text-[#b2b2b2]"
              placeholder="پیام خود را بنویسید..." />
            <button type="button" class="grid h-9 w-9 shrink-0 place-items-center" aria-label="افزودن پیوست">
              <svg class="h-6 w-6 text-[#233047]" aria-hidden="true">
                <use href="#icon-attach"></use>
              </svg>
            </button>
          </label>
        </form>
      </section>

      <!-- SIDEBAR (راست) -->
      <aside class="rounded-[12px] bg-white px-4 pb-4 pt-5 shadow-card" aria-label="لیست گفت‌وگوها">
        <div class="grid grid-cols-2 border-b border-[#cfcfcf]">
          <button type="button" data-conv-tab="all"
            class="conversation-tab h-[42px] border-b-[3px] border-[#aa4938] text-[14px] font-medium text-[#aa4938]">
            همه
          </button>
          <button type="button" data-conv-tab="unread" class="conversation-tab h-[42px] text-[14px] text-[#333]">
            خوانده نشده
          </button>
        </div>

        <div id="desktopConversationList" class="chat-scroll mt-4 max-h-[550px] space-y-3 overflow-y-auto">
        </div>
      </aside>
    </section>

    <!-- =========================================================
         MOBILE: VIEW 1 - لیست گفتگوها
    ========================================================== -->
    <section id="mobileConvView" class="md:hidden">
      <div class="grid h-[60px] grid-cols-2 border-b border-[#d7d7d7] bg-white">
        <button type="button" data-conv-tab-mobile="all"
          class="conversation-tab-mobile border-b-[3px] border-[#aa4938] text-[15px] font-medium text-[#aa4938]">
          همه
        </button>
        <button type="button" data-conv-tab-mobile="unread" class="conversation-tab-mobile text-[15px] text-[#333]">
          خوانده نشده
        </button>
      </div>

      <div id="mobileConversationList" class="mt-4 space-y-3">
      </div>
    </section>

    ========================================================== -->

          <svg class="h-6 w-6" aria-hidden="true">
            <use href="#icon-arrow-left"></use>
          </svg>
        </button>

        <div class="grid h-[44px] w-[44px] place-items-center rounded-full bg-[#e5e5e5] text-[#263247]">
          <svg class="h-6 w-6" aria-hidden="true">
            <use href="#icon-user"></use>
          </svg>
        </div>

        <span id="mobileChatName" class="text-[17px] font-medium">نام کاربر</span>

        <button type="button" id="mobileMoreBtn"
          class="mr-auto grid h-10 w-10 place-items-center rounded-md hover:bg-[#f5f5f5]" aria-label="گزینه‌های گفت‌وگو"
          aria-expanded="false">
          <svg class="h-5 w-5" aria-hidden="true">
            <use href="#icon-more"></use>
          </svg>
        </button>

        <div id="mobileMoreMenu"
          class="floating-menu absolute left-4 top-[70px] z-30 hidden w-[190px] overflow-hidden rounded-[8px] border border-[#dedede] bg-white">
          <button type="button" data-open-report>گزارش گفتگو</button>
        </div>
      </div>

      <!-- پیام‌ها -->
      <div id="mobileChatMessages"
        class="chat-scroll h-[calc(100dvh-76px-76px-140px)] overflow-y-auto bg-[#fdfdfd] px-4 py-4 space-y-4">
      </div>

      <!-- فرم ارسال -->
      <form id="mobileMessageForm"
        class="fixed bottom-[76px] left-0 right-0 flex h-[70px] items-center gap-2 border-t border-[#c9c9c9] bg-white px-4"
        dir="ltr">
        <button type="submit"
          class="h-[44px] w-[80px] shrink-0 rounded-[10px] bg-[#aa4938] text-[14px] font-medium text-white">

  <section id="reportReasonModal" class="store-modal hidden" style="max-width: 500px;" role="dialog" aria-modal="true">
    <header class="store-modal-header">
      <h2 class="text-[17px] font-bold">گزارش تخلف در گفتگو</h2>
      <button type="button" data-close-report class="grid h-8 w-8 place-items-center" aria-label="بستن">
        <svg class="h-5 w-5" aria-hidden="true">
          <use href="#icon-close"></use>
        </svg>
      </button>
    </header>

    <div id="reportReasonList" class="space-y-1 px-3 py-3"></div>
  </section>

  <!-- =========================================================
       Modal: گزارش گفتگو (مرحله ۲ - توضیحات)
  ========================================================== -->
  <section id="reportDetailsModal" class="store-modal hidden" style="max-width: 500px;" role="dialog" aria-modal="true">
    <div class="p-6">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-[17px] font-bold">دلیل گزارش</h2>
        <button type="button" data-close-report class="grid h-8 w-8 place-items-center" aria-label="بستن">
          <svg class="h-5 w-5" aria-hidden="true">
            <use href="#icon-close"></use>
          </svg>
        </button>
      </div>

      <p id="selectedReportReason" class="mb-5 rounded-[8px] bg-[#f6f6f6] px-4 py-3 text-[14px] text-[#555]"></p>

      <label class="mb-2 block text-[13px] font-semibold">توضیحات بیشتر</label>
      <textarea id="reportDetails" rows="3"
        class="h-[90px] w-full resize-none rounded-[8px] border border-[#9d9d9d] p-3 text-[13px] outline-none placeholder:text-[#b4b4b4] focus:border-[#aa4938]"
        placeholder="برای بررسی بهتر، می‌توانید جزئیات بیشتری بنویسید."></textarea>

      <label class="mt-5 flex cursor-pointer items-start gap-3">
        <input id="blockStoreCheckbox" type="checkbox" class="sr-only" />
        <span class="mt-[2px] grid h-5 w-5 shrink-0 place-items-center rounded-[4px] border border-[#999] bg-white
                     peer-checked:border-[#aa4938]">
        </span>
        <span>
          <span class="block text-[14px] font-medium">این کاربر را مسدود کن</span>
          <span class="mt-1 block text-[11px] text-[#777]">
            پس از مسدودکردن، پیام جدیدی از این کاربر دریافت نمی‌کنید.
          </span>
        </span>
      </label>

      <div class="mt-6 grid grid-cols-2 gap-3" dir="ltr">
        <button type="button" id="submitReport"
          class="h-[46px] rounded-[8px] bg-[#aa4938] text-[14px] font-medium text-white hover:bg-[#934033]">
          ثبت گزارش
        </button>
        <button type="button" data-close-report
          class="h-[46px] rounded-[8px] border border-red-500 text-[14px] font-medium text-red-500 hover:bg-red-50">
          انصراف
        </button>
      </div>
    </div>
  </section>
