  <style>
    .star-filled { color: #ffa000; }
    .star-empty { color: #d9d9d9; }

    .reviews-filter-row {
      overflow-x: auto;
      overflow-y: hidden;
      flex-wrap: nowrap !important;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .reviews-filter-row::-webkit-scrollbar { display: none; }
    .reviews-filter-row > * { flex-shrink: 0; }

    @media (min-width: 768px) {
      .reviews-filter-row {
        flex-wrap: wrap !important;
        overflow: visible !important;
      }
    }

    /* کارت نظر */
    .review-card {
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      border: 1px solid #e5e5e5;
    }

    /* هدر خاکستری کارت */
    .review-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      background: #f2f2f2;
      border-bottom: 1px solid #e5e5e5;
    }

    /* بدنه کارت */
    .review-card-body {
      padding: 22px 26px 26px;
    }
  </style>
</head>

            <div id="popup-rv-sort" data-popup="rv-sort"

              </div>
              <div class="space-y-4 px-6 py-5 text-[14px]">

                <label class="flex cursor-pointer items-center justify-between">

              </div>
              <div class="store-popup-footer text-right">
                <button type="button" data-clear-rv-sort>حذف فیلتر</button>
              </div>
            </div>
          </div>

          <button type="button" data-rv-quick="all"

  <!-- Modal: پاسخ به نظر -->
  <div id="replyModalBackdrop" class="fixed inset-0 z-40 hidden bg-black/45"></div>

    <header class="store-modal-header">
      <h2 class="text-[17px] font-bold">پاسخ به نظر</h2>
      <button type="button" data-close-modal class="grid h-8 w-8 place-items-center">
        <svg class="h-5 w-5"><use href="#icon-close"></use></svg>
      </button>
    </header>
    <form id="replyForm" class="space-y-4 p-6">
      <div id="replyOriginalReview" class="rounded-[8px] bg-[#f6f6f6] p-4 text-[12px] text-[#555] leading-6"></div>
      <label class="block">
        <span class="mb-2 block text-[13px] font-medium">پاسخ شما</span>
        <textarea id="replyText" r  ows="4" placeholder="پاسخ خود را بنویسید..."
          class="w-full resize-none rounded-[8px] border border-[#aaa] p-3 text-[13px] outline-none focus:border-[#aa4938]"></textarea>
      </label>
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button type="submit"
          class="h-[44px] rounded-[8px] bg-[#aa4938] text-[14px] font-medium text-white hover:bg-[#934033]">
          ارسال پاسخ
        </button>
        <button type="button" data-close-modal class="h-[44px] rounded-[8px] border border-[#ccc] text-[14px]">
          انصراف
        </button>
      </div>
    </form>
  </section>

  <div id="popupOverlay" class="fixed inset-0 z-[100] hidden bg-black/30"></div>
  <div id="toast"
    class="pointer-events-none fixed bottom-24 left-1/2 z-[999] hidden -translate-x-1/2 rounded-[8px] bg-[#333] px-5 py-3 text-[13px] text-white shadow-lg md:bottom-6"
    role="status"></div>
