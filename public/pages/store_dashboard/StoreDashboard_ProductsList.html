                  </span>
                </label>
                <label class="flex cursor-pointer items-center justify-between">
                  <span>آخرین به‌روزرسانی</span>

                  <span class="flex">
                    <input class="sr-only" type="radio" name="sort" value="cheap" />

                <label class="flex cursor-pointer items-center justify-between">
                  <span>متوقف</span>
                  <span class="flex"><input class="sr-only store-filter-checkbox" type="checkbox" data-filter="status"
                      value="stopped" /><span class="store-check-ui"></span></span>
                </label>
                <label class="flex cursor-pointer items-center justify-between">
                  <span>رد شده</span>
                  <span class="flex"><input class="sr-only store-filter-checkbox" type="checkbox" data-filter="status"
                      value="rejected" /><span class="store-check-ui"></span></span>
                </label>
              </div>
              <div class="store-popup-footer text-right">
                <button type="button" data-clear="status">حذف فیلتر</button>
              </div>
            </div>
          </div>

          <!-- Stock -->
          <div class="relative shrink-0" data-popup-wrap>
            <button type="button" data-popup-trigger="popup-stock" class="store-chip">
              <span id="stockChipLabel">موجودی</span>
              <svg class="h-4 w-4" aria-hidden="true">
                <use href="#icon-chevron-down"></use>
              </svg>
            </button>

            <div id="popup-stock" data-popup="stock"
              class="store-popup absolute right-0 top-[46px] z-30 hidden w-[280px] md:w-[320px]">
              <div class="drag-handle"></div>
              <div class="store-popup-header">
                <span>موجودی</span>
                <button type="button" data-close-popup aria-label="بستن">
                  <svg class="h-5 w-5" aria-hidden="true">
                    <use href="#icon-close"></use>
                  </svg>
                </button>
              </div>
              <div class="space-y-4 px-6 py-5 text-[14px]">
                <label class="flex cursor-pointer items-center justify-between">
                  <span>موجود</span>
                  <span class="flex"><input class="sr-only store-filter-checkbox" type="checkbox" data-filter="stock"
                      value="available" /><span class="store-check-ui"></span></span>
                </label>
                <label class="flex cursor-pointer items-center justify-between">
                  <span>موجودی محدود</span>
                  <span class="flex"><input class="sr-only store-filter-checkbox" type="checkbox" data-filter="stock"
                      value="limited" /><span class="store-check-ui"></span></span>
                </label>
                <label class="flex cursor-pointer items-center justify-between">
                  <span>ناموجود</span>
                  <span class="flex"><input class="sr-only store-filter-checkbox" type="checkbox" data-filter="stock"
                      value="unavailable" /><span class="store-check-ui"></span></span>
                </label>
              </div>
              <div class="store-popup-footer text-right">
                <button type="button" data-clear="stock">حذف فیلتر</button>
              </div>
            </div>
          </div>

          <!-- Price Type -->
          <div class="relative shrink-0" data-popup-wrap>
            <button type="button" data-popup-trigger="popup-priceType" class="store-chip">
              <span id="priceTypeChipLabel">نوع قیمت</span>
              <svg class="h-4 w-4" aria-hidden="true">
                <use href="#icon-chevron-down"></use>
              </svg>
            </button>

            <div id="popup-priceType" data-popup="priceType"
              class="store-popup absolute right-0 top-[46px] z-30 hidden w-[280px] md:w-[320px]">
              <div class="drag-handle"></div>
              <div class="store-popup-header">
                <span>نوع قیمت</span>
                <button type="button" data-close-popup aria-label="بستن">
                  <svg class="h-5 w-5" aria-hidden="true">
                    <use href="#icon-close"></use>
                  </svg>
                </button>
              </div>
              <div class="space-y-4 px-6 py-5 text-[14px]">
                <label class="flex cursor-pointer items-center justify-between">
                  <span>مبلغ‌دار</span>
                  <span class="flex"><input class="sr-only store-filter-checkbox" type="checkbox"
                      data-filter="priceType" value="amount" /><span class="store-check-ui"></span></span>
                </label>
                <label class="flex cursor-pointer items-center justify-between">
                  <span>قیمت توافقی</span>
                  <span class="flex"><input class="sr-only store-filter-checkbox" type="checkbox"
                      data-filter="priceType" value="agreement" /><span class="store-check-ui"></span></span>
                </label>
              </div>
              <div class="store-popup-footer text-right">
                <button type="button" data-clear="priceType">حذف فیلتر</button>
              </div>
            </div>
          </div>

          <!-- Category -->
          <div class="relative shrink-0" data-popup-wrap>
            <button type="button" data-popup-trigger="popup-category" class="store-chip">
              <span id="categoryChipLabel">دسته</span>
              <svg class="h-4 w-4" aria-hidden="true">
                <use href="#icon-chevron-down"></use>
              </svg>
            </button>

            <div id="popup-category" data-popup="category"
              class="store-popup absolute right-0 top-[46px] z-30 hidden w-[280px] md:w-[320px]">
              <div class="drag-handle"></div>
              <div class="store-popup-header">
                <span>دسته</span>
                <button type="button" data-close-popup aria-label="بستن">
                  <svg class="h-5 w-5" aria-hidden="true">
                    <use href="#icon-close"></use>
                  </svg>
                </button>
              </div>
              <div class="max-h-[280px] space-y-4 overflow-y-auto px-6 py-5 text-[14px]">
                <label class="flex cursor-pointer items-center justify-between">
                  <span>سیمان و ملات</span>
                  <span class="flex"><input class="sr-only store-filter-checkbox" type="checkbox" data-filter="category"
                      value="cement" /><span class="store-check-ui"></span></span>
                </label>
                <label class="flex cursor-pointer items-center justify-between">
                  <span>گچ و فرآورده‌های گچی</span>
                  <span class="flex"><input class="sr-only store-filter-checkbox" type="checkbox" data-filter="category"
                      value="chalk" /><span class="store-check-ui"></span></span>
                </label>
                <label class="flex cursor-pointer items-center justify-between">
                  <span>بتن و فرآورده‌های بتنی</span>
                  <span class="flex"><input class="sr-only store-filter-checkbox" type="checkbox" data-filter="category"
                      value="concrete" /><span class="store-check-ui"></span></span>
                </label>
                <label class="flex cursor-pointer items-center justify-between">
                  <span>فلزات ساختمانی</span>
                  <span class="flex"><input class="sr-only store-filter-checkbox" type="checkbox" data-filter="category"
                      value="metal" /><span class="store-check-ui"></span></span>
                </label>
              </div>
              <div class="store-popup-footer text-right">
                <button type="button" data-clear="category">حذف فیلتر</button>
              </div>
            </div>
          </div>
        </div>
        <!-- اطلاعات تعداد -->
        <div class="hidden md:flex items-center gap-3 justify-between text-[12px] text-[#777]">
          <div class="flex items-center gap-2">
            <span>تعداد نمایش:</span>
            <select id="pageSize"
              class="h-8 rounded-[5px] border border-[#cfcfcf] bg-white px-2 text-[12px] outline-none">
              <option value="4">۴</option>
              <option value="10" selected>۱۰</option>
              <option value="20">۲۰</option>
            </select>
          </div>
          <div>
            تعداد محصولات:
            <span id="resultCount" class="font-medium text-[#333]">۱۲۳</span>
          </div>
        </div>
      </div>
      <div class="md:hidden flex items-center mt-4 gap-3 justify-between text-[12px] text-[#777]">
        <div class="flex items-center gap-2">
          <span>تعداد نمایش:</span>
          <select id="pageSize"
            class="h-8 rounded-[5px] border border-[#cfcfcf] bg-white px-2 text-[12px] outline-none">
            <option value="4">۴</option>
            <option value="10" selected>۱۰</option>
            <option value="20">۲۰</option>
          </select>
        </div>
        <div>
          تعداد محصولات:
          <span id="resultCount" class="font-medium text-[#333]">۱۲۳</span>
        </div>
      </div>


      <!-- لیست محصولات (کارت‌ها) -->
      <div id="productList" class="mt-5 space-y-3.5"></div>

      <!-- حالت خالی
      <div id="emptyState" class="store-empty hidden!">
        <img src="../../../images/StoreDashboard/Reviews/empty-reviews.svg" alt="بدون محصول" />
        <p>محصولی با این مشخصات پیدا نشد.</p>
        <p class="store-empty-hint">برای افزودن محصول جدید روی دکمه «ثبت محصول جدید» کلیک کنید.</p>
      </div> -->

      <!-- Pagination -->
      <div id="paginationNumbers" class="mt-6 flex items-center justify-center gap-1 text-[13px]" dir="ltr"></div>
    </section>
    <button id="addProductBtn" type="button"
      class="md:hidden mx-auto mt-4 flex items-center justify-center gap-2 rounded-full bg-custom-brown px-7 py-2.5 text-xs font-medium text-white transition hover:bg-[#934033] md:text-sm whitespace-nowrap">
       +   ثبت محصول جدید
    </button>
  </main>

  <!-- =========================================================
       Filter Drawer (موبایل fullscreen / دسکتاپ 390px)
  ========================================================== -->
  <div id="filterBackdrop" class="fixed inset-0 z-40 hidden bg-black/25"></div>

  <aside id="filterDrawer"
    class="store-filter-drawer mobile-fullscreen fixed bottom-0 right-0 top-0 z-50 w-full max-w-[390px] translate-x-full bg-white shadow-2xl transition-transform duration-200"
    role="dialog" aria-modal="true" aria-label="فیلترها">

    <div class="flex h-full flex-col">
      <header class="flex h-[60px] items-center justify-between border-b border-[#e5e5e5] px-6">
        <h2 class="text-[18px] font-semibold">فیلترها</h2>
        <div class="flex items-center gap-4">
          <button type="button" id="clearAllFilters" class="text-[14px] text-[#aa4938]">حذف فیلترها</button>
          <button type="button" id="closeDrawer" class="grid h-8 w-8 place-items-center" aria-label="بستن">
            <svg class="h-5 w-5" aria-hidden="true">
              <use href="#icon-close"></use>
            </svg>
          </button>
        </div>
      </header>

      <div class="flex-1 space-y-6 overflow-y-auto px-6 py-5">

        <!-- وضعیت -->
        <section>
          <h3 class="mb-4 font-semibold">وضعیت انتشار</h3>
          <div class="space-y-4 text-[14px]">
            <label class="flex cursor-pointer items-center justify-between">
              <span>منتشر شده</span>
              <span class="flex"><input class="sr-only store-drawer-checkbox" type="checkbox" data-filter="status"
                  value="published" /><span class="store-check-ui"></span></span>
            </label>
            <label class="flex cursor-pointer items-center justify-between">
              <span>در انتظار تأیید</span>
              <span class="flex"><input class="sr-only store-drawer-checkbox" type="checkbox" data-filter="status"
                  value="pending" /><span class="store-check-ui"></span></span>
            </label>
            <label class="flex cursor-pointer items-center justify-between">
              <span>پیش‌نویس</span>
              <span class="flex"><input class="sr-only store-drawer-checkbox" type="checkbox" data-filter="status"
                  value="draft" /><span class="store-check-ui"></span></span>
            </label>
            <label class="flex cursor-pointer items-center justify-between">
              <span>متوقف</span>
              <span class="flex"><input class="sr-only store-drawer-checkbox" type="checkbox" data-filter="status"
                  value="stopped" /><span class="store-check-ui"></span></span>
            </label>
          </div>
        </section>

        <div class="store-divider"></div>

        <!-- موجودی -->
        <section>
          <h3 class="mb-4 font-semibold">موجودی</h3>
          <div class="space-y-4 text-[14px]">
            <label class="flex cursor-pointer items-center justify-between">
              <span>موجود</span>
              <span class="flex"><input class="sr-only store-drawer-checkbox" type="checkbox" data-filter="stock"
                  value="available" /><span class="store-check-ui"></span></span>
            </label>
            <label class="flex cursor-pointer items-center justify-between">
              <span>موجودی محدود</span>
              <span class="flex"><input class="sr-only store-drawer-checkbox" type="checkbox" data-filter="stock"
                  value="limited" /><span class="store-check-ui"></span></span>
            </label>
            <label class="flex cursor-pointer items-center justify-between">
              <span>ناموجود</span>
              <span class="flex"><input class="sr-only store-drawer-checkbox" type="checkbox" data-filter="stock"
                  value="unavailable" /><span class="store-check-ui"></span></span>
            </label>
          </div>
        </section>

        <div class="store-divider"></div>

        <!-- نوع قیمت -->
        <section>
          <h3 class="mb-4 font-semibold">نوع قیمت</h3>
          <div class="space-y-4 text-[14px]">
            <label class="flex cursor-pointer items-center justify-between">
              <span>مبلغ‌دار</span>
              <span class="flex"><input class="sr-only store-drawer-checkbox" type="checkbox" data-filter="priceType"
                  value="amount" /><span class="store-check-ui"></span></span>
            </label>
            <label class="flex cursor-pointer items-center justify-between">
              <span>قیمت توافقی</span>
              <span class="flex"><input class="sr-only store-drawer-checkbox" type="checkbox" data-filter="priceType"
                  value="agreement" /><span class="store-check-ui"></span></span>
            </label>
          </div>
        </section>

        <div class="store-divider"></div>

        <!-- بازه قیمت -->
        <section>
          <h3 class="mb-4 font-semibold">بازه قیمت</h3>
          <div class="grid grid-cols-2 gap-3">
            <label>
              <span class="mb-2 block text-[12px] text-[#777]">از قیمت</span>
              <input id="minPriceFilter" inputmode="numeric" placeholder="۰"
                class="h-[42px] w-full rounded-[7px] border border-[#aaa] px-3 text-[13px] outline-none" />
            </label>
            <label>
              <span class="mb-2 block text-[12px] text-[#777]">تا قیمت</span>
              <input id="maxPriceFilter" inputmode="numeric" placeholder="بدون محدودیت"
                class="h-[42px] w-full rounded-[7px] border border-[#aaa] px-3 text-[13px] outline-none" />
            </label>
          </div>
        </section>
      </div>

      <footer class="border-t border-[#e5e5e5] p-6">
        <button type="button" id="applyDrawerFilters"
          class="h-[46px] w-full rounded-[7px] bg-[#aa4938] text-[15px] font-medium text-white hover:bg-[#934033]">
          اعمال فیلتر
        </button>
      </footer>
    </div>
  </aside>

  <!-- =========================================================
       Modal: افزودن / ویرایش محصول
  ========================================================== -->
  <div id="productModalBackdrop" class="fixed inset-0 z-40 hidden bg-black/45"></div>

  <section id="productModal" data-modal class="store-modal hidden" role="dialog" aria-modal="true"
    aria-labelledby="productModalTitle">

    <header class="store-modal-header">
      <h2 id="productModalTitle" class="text-[17px] font-bold">افزودن محصول جدید</h2>
      <button type="button" id="closeProductModal" class="grid h-8 w-8 place-items-center" aria-label="بستن">
        <svg class="h-5 w-5" aria-hidden="true">
          <use href="#icon-close"></use>
        </svg>
      </button>
    </header>

    <form id="productForm" class="space-y-4 p-6">
      <label class="block">
        <span class="mb-2 block text-[13px] text-[#555]">عنوان محصول</span>
        <input id="productTitle" type="text" required placeholder="مثلاً سیمان تیپ ۱"
          class="h-[44px] w-full rounded-[8px] border border-[#c9c9c9] px-3 text-[14px] outline-none focus:border-[#aa4938]" />
      </label>

      <div class="grid grid-cols-2 gap-3">
        <label class="block">
          <span class="mb-2 block text-[13px] text-[#555]">قیمت (تومان)</span>
          <input id="productPrice" type="text" inputmode="numeric" placeholder="۰"
            class="h-[44px] w-full rounded-[8px] border border-[#c9c9c9] px-3 text-[14px] outline-none focus:border-[#aa4938]" />
        </label>
        <label class="block">
          <span class="mb-2 block text-[13px] text-[#555]">موجودی (واحد)</span>
          <input id="productStock" type="text" inputmode="numeric" placeholder="۰"
            class="h-[44px] w-full rounded-[8px] border border-[#c9c9c9] px-3 text-[14px] outline-none focus:border-[#aa4938]" />
        </label>
      </div>

      <label class="block">
        <span class="mb-2 block text-[13px] text-[#555]">دسته‌بندی</span>
        <select id="productCategory"
          class="h-[44px] w-full rounded-[8px] border border-[#c9c9c9] bg-white px-3 text-[14px] outline-none focus:border-[#aa4938]">
          <option value="">انتخاب دسته</option>
          <option value="cement">سیمان و ملات</option>
          <option value="chalk">گچ و فرآورده‌های گچی</option>
          <option value="concrete">بتن و فرآورده‌های بتنی</option>
          <option value="metal">فلزات ساختمانی</option>
        </select>
      </label>

      <label class="block">
        <span class="mb-2 block text-[13px] text-[#555]">توضیحات</span>
        <textarea id="productDescription" rows="3" placeholder="توضیحات کوتاهی بنویسید"
          class="w-full resize-none rounded-[8px] border border-[#c9c9c9] px-3 py-3 text-[14px] outline-none focus:border-[#aa4938]"></textarea>
      </label>

      <div class="flex gap-3 pt-2">
        <button type="submit"
          class="h-[44px] flex-1 rounded-[8px] bg-[#aa4938] text-[14px] font-medium text-white hover:bg-[#934033]">
          ذخیره
        </button>
        <button type="button" id="cancelProductBtn"
          class="h-[44px] flex-1 rounded-[8px] border border-[#ccc] text-[14px] hover:bg-[#f7f7f7]">
          انصراف
        </button>
      </div>
    </form>
  </section>

  <!-- =========================================================
       Overlay موبایل + Toast
  ========================================================== -->
  <div id="popupOverlay" class="fixed inset-0 z-[100] hidden bg-black/30" aria-hidden="true"></div>

  <div id="toast"
    class="pointer-events-none fixed bottom-24 left-1/2 z-[999] hidden -translate-x-1/2 rounded-[8px] bg-[#333] px-5 py-3 text-[13px] text-white shadow-lg md:bottom-6"
    role="status" aria-live="polite"></div>

  <!-- =========================================================
       Scripts
  ========================================================== -->
  <script src="../../scripts/StoreDashboard/store-common.js"></script>
  <script src="../../scripts/StoreDashboard/store-products.js"></script>
</body>

</html>
