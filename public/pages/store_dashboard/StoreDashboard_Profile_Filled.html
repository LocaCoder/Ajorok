<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>اطلاعات فروشگاه | پنل فروشگاه جورک</title>
  <meta name="description" content="مشاهده و ویرایش اطلاعات فروشگاه." />
  <link rel="stylesheet" href="../../styles/output.css" />
  <link rel="stylesheet" href="../../styles/store-common.css" />
</head>

<body class="store-dashboard-page min-h-screen bg-[#f3f3f3] text-[#252525] font-IRANSansXRegular antialiased">

  <svg class="hidden" aria-hidden="true" focusable="false">
    <symbol id="icon-arrow-left" viewBox="0 0 24 24" fill="none">
      <path d="M14 7l-5 5 5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24" fill="none">
      <path d="M12 4 2.5 20h19L12 4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M12 10v4M12 17h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
  </svg>

  <header class="store-desktop-header hidden md:block mb-8" role="banner">
    <div class="store-header-inner">
      <div class="flex items-center gap-4">
        <a href="../../index.html"><img src="../../images/logo/Logo.svg" alt="لوگو" /></a>
        <span class="hidden h-10 w-px bg-[#d9d9d9] sm:block"></span>
        <nav class="hidden items-center gap-8 md:flex">
          <a href="../../index.html" class="flex items-center gap-2 text-[15px] font-medium text-[#2b2b2b]">
            <img src="../../images/Header/home 04.svg" alt="" />صفحه اصلی سایت
          </a>
          <button class="flex items-center gap-2 text-[15px] font-medium text-[#2b2b2b]">
            <img src="../../images/Header/grid 02.svg" alt="" />صفحات فروشگاه
            <img src="../../images/Header/direction-down 01.svg" alt="" />
          </button>
        </nav>
      </div>
      <div class="flex items-center gap-3 sm:gap-7" dir="ltr">
        <div class="flex items-center gap-3">
          <div class="h-9 w-9 rounded-full bg-[#202020]"></div>
          <div class="hidden leading-tight sm:block" dir="rtl">
            <div class="text-[14px] font-medium">نام فروشگاه</div>
            <div class="mt-1 text-[11px] text-[#777]">نام فروشنده</div>
          </div>
        </div>
        <div class="hidden items-center gap-3 sm:flex lg:gap-5">
          <a href="StoreDashboard_Notifications.html" class="grid h-9 w-9 place-items-center rounded-lg hover:bg-[#f7f7f7]"><img src="../../images/Header/notification.svg" alt="" /></a>
          <a href="StoreDashboard_Messages.html" class="grid h-9 w-9 place-items-center rounded-lg hover:bg-[#f7f7f7]"><img src="../../images/Header/mail.svg" alt="" /></a>
        </div>
      </div>
    </div>
  </header>

  

  <main class="store-shell mx-auto w-full max-w-[1200px] px-4 pb-32 pt-5 md:pb-16 md:pt-[54px] lg:px-0" role="main">

    <section class="store-page-title-card mb-6 hidden md:flex">
      <h1 class="store-title">اطلاعات فروشگاه</h1>
    </section>

    <!-- هشدار -->
    <section class="flex items-center gap-3 rounded-[12px] border border-[#d1aaa4] bg-[#f5edeb] p-4 md:p-5">
      <svg class="h-6 w-6 shrink-0 text-[#aa4938]"><use href="#icon-warning"></use></svg>
      <div class="flex flex-1 flex-wrap items-center gap-x-6 gap-y-2 text-[12px] text-[#262626] md:text-[13px]">
        <a href="Orders/StoreDashboard_Orders_List.html" class="flex items-center gap-1 hover:text-[#aa4938]">
          سفارش‌های نیازمند اقدام: ۳
          <svg class="h-4 w-4"><use href="#icon-arrow-left"></use></svg>
        </a>
        <a href="Products/StoreDashboard_ProductsList.html" class="flex items-center gap-1 hover:text-[#aa4938]">
          موجودی بحرانی: ۳
          <svg class="h-4 w-4"><use href="#icon-arrow-left"></use></svg>
        </a>
        <a href="Products/StoreDashboard_ProductsList.html" class="flex items-center gap-1 hover:text-[#aa4938]">
          عدم موجودی: ۲
          <svg class="h-4 w-4"><use href="#icon-arrow-left"></use></svg>
        </a>
        <a href="StoreDashboard_Finance.html" class="flex items-center gap-1 hover:text-[#aa4938]">
          تسویه ناموفق: ۱
          <svg class="h-4 w-4"><use href="#icon-arrow-left"></use></svg>
        </a>
      </div>
    </section>

    <!-- فرم اطلاعات -->
    <section class="mt-5 rounded-[14px] bg-white p-5 shadow-card md:p-8">
      <form id="profileForm" class="space-y-6" novalidate>

        <!-- بخش ۱: اطلاعات پایه -->
        <div>
          <h3 class="mb-4 border-b border-[#ededed] pb-3 text-[15px] font-bold text-[#aa4938]">
            اطلاعات فروشگاه
          </h3>

          <div class="grid gap-4 md:grid-cols-2">
            <label class="block">
              <span class="mb-2 block text-[13px]">نام فروشگاه</span>
              <input name="storeName" readonly value="نام فروشگاه"
                class="form-control h-[50px] w-full rounded-[8px] border border-[#999] bg-[#fafafa] px-4 text-[13px] outline-none" />
            </label>

            <label class="block">
              <span class="mb-2 block text-[13px]">نام کاربری فروشگاه</span>
              <input name="username" readonly value="abcded" dir="ltr"
                class="form-control h-[50px] w-full rounded-[8px] border border-[#999] bg-[#fafafa] px-4 text-right text-[13px] outline-none" />
            </label>

            <label class="block">
              <span class="mb-2 block text-[13px]">شهر</span>
              <input name="city" readonly value="تهران"
                class="form-control h-[50px] w-full rounded-[8px] border border-[#999] bg-[#fafafa] px-4 text-[13px] outline-none" />
            </label>

            <label class="block">
              <span class="mb-2 block text-[13px]">استان</span>
              <input name="province" readonly value="تهران"
                class="form-control h-[50px] w-full rounded-[8px] border border-[#999] bg-[#fafafa] px-4 text-[13px] outline-none" />
            </label>
          </div>
        </div>

        <!-- بخش ۲: اطلاعات تماس -->
        <div>
          <h3 class="mb-4 border-b border-[#ededed] pb-3 text-[15px] font-bold text-[#aa4938]">
            اطلاعات تماس
          </h3>

          <div class="grid gap-4 md:grid-cols-2">
            <label class="block">
              <span class="mb-2 block text-[13px]">شماره تلفن ثابت</span>
              <input name="phone" readonly value="۰۲۱-۱۲۳۴۵۶۷"
                class="form-control h-[50px] w-full rounded-[8px] border border-[#999] bg-[#fafafa] px-4 text-[13px] outline-none" />
            </label>

            <label class="block">
              <span class="mb-2 block text-[13px]">شماره تلفن همراه</span>
              <input name="mobile" readonly value="۰۹۱۲ ۱۲۳ ۴۵ ۶۷"
                class="form-control h-[50px] w-full rounded-[8px] border border-[#999] bg-[#fafafa] px-4 text-[13px] outline-none" />
            </label>

            <label class="block">
              <span class="mb-2 block text-[13px]">آدرس ایمیل</span>
              <input name="email" readonly value="store@example.com" dir="ltr"
                class="form-control h-[50px] w-full rounded-[8px] border border-[#999] bg-[#fafafa] px-4 text-right text-[13px] outline-none" />
            </label>

            <label class="block">
              <span class="mb-2 block text-[13px]">آدرس وبسایت</span>
              <input name="website" readonly value="www.example.com" dir="ltr"
                class="form-control h-[50px] w-full rounded-[8px] border border-[#999] bg-[#fafafa] px-4 text-right text-[13px] outline-none" />
            </label>
          </div>
        </div>

        <!-- بخش ۳: آدرس -->
        <div>
          <h3 class="mb-4 border-b border-[#ededed] pb-3 text-[15px] font-bold text-[#aa4938]">
            آدرس و اطلاعات تکمیلی
          </h3>

          <label class="block">
            <span class="mb-2 block text-[13px]">آدرس پستی</span>
            <textarea name="address" readonly rows="3"
              class="form-control min-h-[110px] w-full resize-none rounded-[8px] border border-[#999] bg-[#fafafa] px-4 py-3 text-[13px] outline-none">تهران، خیابان ولیعصر، برج نگین، طبقه ۵، واحد ۱۲</textarea>
          </label>

          <div class="mt-4 grid gap-4 md:grid-cols-3">
            <label class="block">
              <span class="mb-2 block text-[13px]">کد پستی</span>
              <input name="postalCode" readonly value="۱۲۳۴۵۶۷۸۹۰"
                class="form-control h-[50px] w-full rounded-[8px] border border-[#999] bg-[#fafafa] px-4 text-[13px] outline-none" />
            </label>

            <label class="block">
              <span class="mb-2 block text-[13px]">نوع فروشگاه</span>
              <input name="storeType" readonly value="حضوری و آنلاین"
                class="form-control h-[50px] w-full rounded-[8px] border border-[#999] bg-[#fafafa] px-4 text-[13px] outline-none" />
            </label>

            <label class="block">
              <span class="mb-2 block text-[13px]">ساعت کاری</span>
              <input name="workHours" readonly value="۹ صبح تا ۶ عصر"
                class="form-control h-[50px] w-full rounded-[8px] border border-[#999] bg-[#fafafa] px-4 text-[13px] outline-none" />
            </label>
          </div>
        </div>

        <!-- بخش ۴: شبکه‌های اجتماعی -->
        <div>
          <h3 class="mb-4 border-b border-[#ededed] pb-3 text-[15px] font-bold text-[#aa4938]">
            شبکه‌های اجتماعی
          </h3>

          <div class="grid gap-4 md:grid-cols-2">
            <label class="block">
              <span class="mb-2 block text-[13px]">آدرس اینستاگرام</span>
              <input name="instagram" readonly value="@store.name" dir="ltr"
                class="form-control h-[50px] w-full rounded-[8px] border border-[#999] bg-[#fafafa] px-4 text-right text-[13px] outline-none" />
            </label>

            <label class="block">
              <span class="mb-2 block text-[13px]">شماره واتس‌اپ</span>
              <input name="whatsapp" readonly value="۰۹۱۲ ۱۲۳ ۴۵ ۶۷"
                class="form-control h-[50px] w-full rounded-[8px] border border-[#999] bg-[#fafafa] px-4 text-[13px] outline-none" />
            </label>
          </div>
        </div>

        <!-- دکمه‌ها -->
        <div class="flex flex-wrap justify-end gap-3 border-t border-[#ededed] pt-5">
          <button type="button" id="cancelBtn"
            class="hidden h-[45px] rounded-[8px] border border-[#bbb] bg-white px-6 text-[13px]">
            انصراف
          </button>
          <button type="button" id="editBtn"
            class="h-[45px] rounded-[8px] bg-[#aa4938] px-6 text-[13px] font-medium text-white hover:bg-[#934033]">
            ویرایش اطلاعات
          </button>
        </div>
      </form>
    </section>
  </main>

  <!-- Bottom Nav -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 border-t border-[#dedede] bg-white md:hidden">
    <ul class="store-bottom-nav w-full flex items-center justify-between pb-3">
      <li class="flex-1 flex flex-col items-center justify-center gap-1 pt-3 text-[#333]">
        <img src="../../images/ShopDashboard/botton/store.svg" alt="" class="h-6 w-6" />
        <a href="StoreDashboard.html" class="text-[11px]">فروشگاه من</a>
      </li>
      <li class="flex-1 flex flex-col items-center justify-center gap-1 pt-3 text-[#333]">
        <img src="../../images/ShopDashboard/botton/bag 01.svg" alt="" class="h-6 w-6" />
        <a href="Products/StoreDashboard_ProductsList.html" class="text-[11px]">محصولات</a>
      </li>
      <li class="flex-1 flex flex-col items-center justify-center gap-1 pt-3 text-[#333]">
        <img src="../../images/ShopDashboard/botton/cart 01.svg" alt="" class="h-6 w-6" />
        <a href="Orders/StoreDashboard_Orders_List.html" class="text-[11px]">سفارش‌ها</a>
      </li>
      <li class="flex-1 flex flex-col items-center justify-center gap-1 pt-3 text-[#333]">
        <img src="../../images/ShopDashboard/botton/mail.svg" alt="" class="h-6 w-6" />
        <a href="StoreDashboard_Messages.html" class="text-[11px]">پیام‌ها</a>
      </li>
      <li class="flex-1 flex flex-col items-center justify-center gap-1 pt-3 text-custom-brown active">
        <img src="../../images/ShopDashboard/botton/menu-line-horizontal.svg" alt="" class="h-6 w-6" />
        <a href="StoreDashboard_Profile_Filled.html" class="text-[11px]">سایر</a>
      </li>
    </ul>
  </nav>

  <div id="popupOverlay" class="fixed inset-0 z-[100] hidden bg-black/30"></div>
  <div id="toast" class="pointer-events-none fixed bottom-24 left-1/2 z-[999] hidden -translate-x-1/2 rounded-[8px] bg-[#333] px-5 py-3 text-[13px] text-white shadow-lg md:bottom-6" role="status"></div>

  <script src="../../scripts/StoreDashboard/store-common.js"></script>
  <script src="../../scripts/StoreDashboard/store-profile.js"></script>
</body>

</html>
